[package]
name = "moraine-launcher"
description = "Game-agnostic installer core that verifies locked artifacts and applies a per-game plan"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license = "MIT OR Apache-2.0"

[[bin]]
name = "moraine-launcher"
path = "src/main.rs"

[dependencies]
moraine-codec = { path = "../codec" }
moraine-install = { path = "../install" }
moraine-model = { path = "../model" }
moraine-resolver = { path = "../resolver" }
clap.workspace = true
hex.workspace = true
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "blocking"] }
serde_json.workspace = true
sha2.workspace = true

[dev-dependencies]
tempfile = "3"
