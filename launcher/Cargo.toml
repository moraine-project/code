[package]
name = "moraine-launcher"
description = "Game-agnostic installer core that verifies locked artifacts and applies a per-game plan"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license = "MIT OR Apache-2.0"

[[bin]]
name = "moraine-launcher"
path = "src/main.rs"

[dependencies]
moraine-codec = { version = "0.1.0", path = "../codec" }
moraine-crypto = { version = "0.1.0", path = "../crypto" }
moraine-install = { version = "0.1.0", path = "../install" }
moraine-metadata = { version = "0.1.0", path = "../metadata" }
moraine-model = { version = "0.1.0", path = "../model" }
moraine-resolver = { version = "0.1.0", path = "../resolver" }
clap.workspace = true
hex.workspace = true
reqwest = { version = "0.13", default-features = false, features = ["rustls", "webpki-roots", "blocking"] }
serde_json.workspace = true
sha2.workspace = true

[dev-dependencies]
tempfile = "3"
