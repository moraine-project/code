name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  rust:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: moraine
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo +nightly fmt --all -- --check
      - run: cargo clippy --all-features --all-targets -- -D warnings
      - run: cargo test --workspace
      - run: cargo run -q -p moraine-verify -- vectors
      - name: Independent corpus check
        run: python3 interop/verify_vectors.py
      - name: Prepare the Postgres test database
        run: |
          PGPASSWORD=postgres psql -h 127.0.0.1 -U postgres -c "CREATE ROLE moraine_app LOGIN PASSWORD 'app'"
          PGPASSWORD=postgres psql -h 127.0.0.1 -U postgres -c "CREATE DATABASE moraine_app_test OWNER moraine_app"
      - name: Server tests on Postgres
        env:
          MORAINE_TEST_POSTGRES: postgres://moraine_app:app@127.0.0.1:5432/moraine_app_test
        run: cargo test -p moraine-server

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm fmt:check
      - run: pnpm lint
      - run: pnpm check
      - run: pnpm test
      - run: pnpm build:static
