[package]
name = "moraine-publish"
description = "Command-line publisher for Moraine homes"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license = "MIT OR Apache-2.0"

[[bin]]
name = "moraine-publish"
path = "src/main.rs"

[dependencies]
clap.workspace = true
getrandom = "0.3"
hex.workspace = true
moraine-crypto = { path = "../crypto" }
moraine-install = { path = "../install" }
moraine-metadata = { path = "../metadata" }
moraine-model = { path = "../model" }
reqwest = { version = "0.13", default-features = false, features = ["rustls", "webpki-roots", "stream"] }
serde_json.workspace = true
sha2.workspace = true
tokio = { version = "1", features = ["macros", "rt-multi-thread", "fs"] }
tokio-util = { version = "0.7", features = ["io"] }

[dev-dependencies]
tempfile = "3"
