[package]
name = "moraine-wasm"
description = "Browser signer for Moraine objects, compiled to WebAssembly"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license = "MIT OR Apache-2.0"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
moraine-crypto = { version = "0.1.0", path = "../crypto" }
moraine-model = { version = "0.1.0", path = "../model" }
serde.workspace = true
serde_json.workspace = true
hex.workspace = true
zeroize = "1"
wasm-bindgen = "0.2"

[dev-dependencies]
wasm-bindgen-test = "0.3"
