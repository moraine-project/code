receivers:
  prometheus:
    config:
      scrape_configs:
        - job_name: moraine
          scrape_interval: 30s
          static_configs:
            - targets: ["${env:MORAINE_METRICS_TARGET}"]

exporters:
  otlp/signoz:
    endpoint: ${env:SIGNOZ_OTLP_ENDPOINT}
    headers:
      signoz-access-token: ${env:SIGNOZ_ACCESS_TOKEN}

service:
  pipelines:
    metrics:
      receivers: [prometheus]
      exporters: [otlp/signoz]
