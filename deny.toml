[graph]
all-features = true

[advisories]
version = 2
ignore = []

[licenses]
version = 2
confidence-threshold = 0.9
allow = [
	"MIT",
	"Apache-2.0",
	"Apache-2.0 WITH LLVM-exception",
	"BSD-2-Clause",
	"BSD-3-Clause",
	"ISC",
	"Unicode-3.0",
	"Zlib",
	"MPL-2.0",
	"CC0-1.0",
	"Unlicense",
	"BSL-1.0",
	"0BSD",
	"AGPL-3.0-or-later",
	"CDLA-Permissive-2.0",
]

[bans]
allow-wildcard-paths = true
multiple-versions = "warn"
wildcards = "deny"
highlight = "all"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
